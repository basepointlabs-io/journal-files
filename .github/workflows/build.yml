name: Build

# Builds and tests on every push and pull request and produces the installer and the portable exe files.
# Pushing a tag like v0.3.0 (it must match <Version> in Directory.Build.props) also publishes a GitHub Release
# with the installer, the portable exe files and the notes from docs/releases/v0.3.0.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to create releases for v* tags

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PYTHONUTF8: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "value=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match Directory.Build.props version $v"
          }

      - name: Validate rule base
        run: python tools/validate_kb.py

      - name: Build
        run: dotnet build RevitJournalAnalyzer.slnx -c Release

      - name: Test
        run: dotnet test tests/RevitJournal.Tests/RevitJournal.Tests.csproj -c Release --no-build

      - name: Publish exe (x64 and ARM64)
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/RevitJournal.App/RevitJournal.App.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
              -o "publish/$rid"
            Copy-Item "publish/$rid/RevitJournalAnalyzer.exe" "publish/RevitJournalAnalyzer-$v-portable-$($rid.Substring(4)).exe"
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer/RevitJournalAnalyzer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: RevitJournalAnalyzer-${{ steps.version.outputs.value }}
          path: |
            publish/RevitJournalAnalyzer-*-setup.exe
            publish/RevitJournalAnalyzer-*-portable-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Revit Journal Analyzer ${{ steps.version.outputs.value }}
          body_path: docs/releases/v${{ steps.version.outputs.value }}.md
          files: |
            publish/RevitJournalAnalyzer-*-setup.exe
            publish/RevitJournalAnalyzer-*-portable-*.exe

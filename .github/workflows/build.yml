name: Build

# Builds and tests on every push and pull request, and publishes the single-file Windows exe as an artifact.
# Pushing a tag like v0.2.0 also attaches both exe files to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to create releases for v* tags

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PYTHONUTF8: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate rule base
        run: python tools/validate_kb.py

      - name: Build
        run: dotnet build RevitJournalAnalyzer.slnx -c Release

      - name: Test
        run: dotnet test tests/RevitJournal.Tests/RevitJournal.Tests.csproj -c Release --no-build

      - name: Publish exe (x64 and ARM64)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/RevitJournal.App/RevitJournal.App.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
              -o "publish/$rid"
            Copy-Item "publish/$rid/RevitJournalAnalyzer.exe" "publish/RevitJournalAnalyzer-$rid.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RevitJournalAnalyzer
          path: publish/RevitJournalAnalyzer-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/RevitJournalAnalyzer-*.exe
